name: whatsapp-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_agent
      POSTGRES_PASSWORD: whatsapp_agent
      POSTGRES_DB: whatsapp_agent
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
